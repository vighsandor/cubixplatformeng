# =============================================================================
# Terraform destroy – egy környezet teljes lebontása kézi indítással
#
# Ha már nem dolgozom rajta, lebontom, hogy ne termeljen költséget.
# Indítás: Actions -> Terraform destroy -> Run workflow (ág: platformeng-w3),
# környezet kiválasztása, és megerősítésként a környezet nevének beírása.
# (A workflow_dispatch-hez a fájlnak az alapértelmezett ágon is ott kell lennie.)
# =============================================================================
name: Terraform destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "A lebontandó környezet (= workspace, pl. sbx vagy dev)"
        required: true
        type: string
      confirm:
        description: "Megerősítés: írd be újra a környezet nevét"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: terraform

jobs:
  destroy:
    name: Terraform Destroy (${{ inputs.environment }})
    if: inputs.environment == inputs.confirm && github.ref == 'refs/heads/platformeng-w3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Létezik ilyen környezet?
        run: test -f "environments/${{ inputs.environment }}.tfvars"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AKS-token előtöltése a kubeloginnak
        # A GitHub OIDC-token csak néhány percig érvényes. Az Azure CLI-nek az
        # AKS (Entra ID server app) scope-ra most kell tokent kérnie, különben a
        # hosszú AKS-létrehozás után a kubelogin már lejárt tokennel próbálkozna.
        # A token kb. 60-90 percig érvényes, és az Azure CLI gyorsítótárából adja.
        run: az account get-access-token --resource 6dae42f8-4368-4678-94ff-3960e28e3630 --query expiresOn -o tsv

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install Azure kubelogin
        uses: azure/use-kubelogin@v1
        env:
          # a 'latest' feloldásához a GitHub API-t hívja, ehhez token kell
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          kubelogin-version: latest

      - name: Terraform init
        run: terraform init

      - name: Terraform workspace
        run: terraform workspace select ${{ inputs.environment }}

      - name: Terraform destroy
        run: terraform destroy -auto-approve -lock-timeout=10m -var-file=environments/${{ inputs.environment }}.tfvars

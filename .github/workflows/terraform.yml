# =============================================================================
# Terraform – plan pull requestre, apply a fő ágra (platformeng-w3) kerüléskor
#
# Környezetek: a terraform/environments/*.tfvars fájlok. Minden fájl egy
# környezet (= Terraform workspace); új környezet igénylése = egy új tfvars
# fájl pull requestben. A plan környezetenként, mátrixban fut.
#
# Az apply LÉPCSŐZETES: merge után először csak a sandbox (sbx) frissül. A
# validate és a plan nem szűr ki mindent; ha valami mégis rossz, a sandboxon
# derül ki. A többi környezet apply-ja csak a sandbox sikere UTÁN, és csak
# kézi jóváhagyással indul (GitHub environment: "promotion", kötelező
# jóváhagyóval; jóváhagyás: Actions -> a futás -> Review deployments, vagy
# scripts/jovahagyas.sh).
# =============================================================================
name: Terraform

on:
  pull_request:
    branches: [platformeng-w3]
  push:
    branches: [platformeng-w3]
  workflow_dispatch:

permissions:
  id-token: write # OIDC token az Azure-bejelentkezéshez (workload identity federation)
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: terraform

jobs:
  environments:
    name: Környezetek
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      first: ${{ steps.list.outputs.first }}
      rest: ${{ steps.list.outputs.rest }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        name: Környezetek listája (environments/*.tfvars)
        env:
          FIRST_ENV: sbx # ez frissül elsőként, jóváhagyás nélkül
        run: |
          list=$(find environments -maxdepth 1 -name '*.tfvars' -printf '%f\n' | sed 's/\.tfvars$//' | sort | jq -R . | jq -cs .)
          first=$(jq -r --arg f "$FIRST_ENV" 'if index($f) then $f else "" end' <<<"$list")
          # üres mátrixot a GitHub nem fogad el, ezért "nincs" esetén egy jelölőérték
          rest=$(jq -c --arg f "$FIRST_ENV" 'map(select(. != $f)) | if length == 0 then ["-"] else . end' <<<"$list")
          echo "Környezetek: $list (elsőként: ${first:-nincs}, utána jóváhagyással: $rest)"
          {
            echo "list=$list"
            echo "first=$first"
            echo "rest=$rest"
          } >> "$GITHUB_OUTPUT"

  plan:
    name: Terraform Plan (${{ matrix.env }})
    needs: environments
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.environments.outputs.list) }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/terraform-setup
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform workspace (${{ matrix.env }})
        run: terraform workspace select -or-create ${{ matrix.env }}

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan -lock-timeout=10m -var-file=environments/${{ matrix.env }}.tfvars -out=tfplan
          {
            echo "## Terraform plan – ${{ matrix.env }}"
            echo '```'
            terraform show -no-color tfplan | grep -E '^\s*# |^Plan:|^No changes' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan csomagolása az apply-hoz
        run: tar -czf ../terraform-plan-${{ matrix.env }}.tar.gz tfplan .terraform.lock.hcl

      - name: Plan feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.env }}
          path: terraform-plan-${{ matrix.env }}.tar.gz
          retention-days: 7 # ennyi ideig lehet jóváhagyni a továbbvitelt

  # Egyetlen, állandó nevű ellenőrzés a rulesethez: a mátrix-jobok neve
  # környezetenként más, a kötelező check viszont csak fix név lehet.
  plan-result:
    name: Terraform Plan
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Minden környezet plan-je sikeres?
        working-directory: .
        run: |
          echo "plan eredménye: ${{ needs.plan.result }}"
          test "${{ needs.plan.result }}" = "success"

  # 1. lépcső: a sandbox, jóváhagyás nélkül
  apply-first:
    name: Terraform Apply (${{ needs.environments.outputs.first }})
    needs: [environments, plan-result]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/platformeng-w3'
      && needs.environments.outputs.first != ''
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-apply-${{ needs.environments.outputs.first }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/terraform-setup
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/terraform-apply
        with:
          env: ${{ needs.environments.outputs.first }}

  # 2. lépcső: a többi környezet, csak a sandbox sikere után és jóváhagyással
  apply-promote:
    name: Terraform Apply (${{ matrix.env }})
    needs: [environments, plan-result, apply-first]
    if: >-
      always() && !cancelled()
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/platformeng-w3'
      && needs.plan-result.result == 'success'
      && (needs.apply-first.result == 'success' || needs.apply-first.result == 'skipped')
      && needs.environments.outputs.rest != '["-"]'
    runs-on: ubuntu-latest
    environment: promotion # kötelező jóváhagyó (bootstrap/02-github-repo.sh environments)
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.environments.outputs.rest) }}
    concurrency:
      group: terraform-apply-${{ matrix.env }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/terraform-setup
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/terraform-apply
        with:
          env: ${{ matrix.env }}
